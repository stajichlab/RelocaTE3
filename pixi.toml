[workspace]
name = "RelocaTE3"
description = "Tool for identifying transposable element transposition from resequencing data"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.10"
minimap2 = ">=2.24"
samtools = ">=1.17"
bedtools = ">=2.30"
pysam = ">=0.20"
biopython = ">=1.81"
pybedtools = "*"
pip = ">=26.1.2,<27"
pytest = ">=7"
seaborn = ">=0.13.2,<0.14"
pandas = ">=3.0.3,<4"
matplotlib = ">=3.11.0,<4"
matplotlib-venn = ">=1.1"

[pypi-dependencies]
RelocaTE3 = { path = ".", editable = true }
sphinx = ">=7.0"
pytest = ">=9.0.3,<10"

[tasks]
test = "pytest -ra -q"
docs = "sphinx-build -b html docs/source docs/_build/html"
# Full real-rice validation: run RelocaTE3 on every sample, normalize both
# call sets, compare, and write validation/real_rice/report/. Pass extra
# args through (e.g. `pixi run validate-rice --local`, `--skip-run`, `--force`).
validate-rice = "bash validation/real_rice/run_validation.sh"
